plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
    id 'org.sonarqube' version '7.6.0.18749'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'net.serenity-bdd:serenity-screenplay-webdriver:4.2.34'
    testImplementation 'net.serenity-bdd:serenity-junit:4.2.34'
    testImplementation 'net.serenity-bdd:serenity-cucumber:4.2.34'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sonar {
    properties {
        property 'sonar.projectKey', 'AndrewSarmiento1909_taller-automatizacion-datepicker'
        property 'sonar.organization', 'andrewsarmiento1909'
        property 'sonar.host.url', 'https://sonarcloud.io'
        // Este repositorio contiene la automatización en src/test/java.
        // Se analiza como código principal del proyecto de automatización.
        property 'sonar.sources', 'src/test/java'
        property 'sonar.tests', ''
        property 'sonar.java.binaries', 'build/classes/java/test'
        property 'sonar.java.libraries', configurations.testRuntimeClasspath.files.collect { it.absolutePath }.join(',')
    }
}
tasks.named('sonar') { dependsOn tasks.named('testClasses') }

test {
    include '**/*Runner.class'
    systemProperty 'webdriver.driver', project.findProperty('browser') ?: 'chrome'
    systemProperty 'taller.viewport.movil', project.findProperty('movil') ?: 'false'
    if (project.hasProperty('dia')) {
        systemProperty 'taller.dia', project.property('dia').toString()
    }
    finalizedBy aggregate
}
